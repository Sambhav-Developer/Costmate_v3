[project]
name = "costmate-Backend"
version = "0.1.0"
description = "FastAPI + LangGraph Backend for Costmate cost estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "pymupdf>=1.22.0",
    "psycopg[binary]>=3.1.0",
    "psycopg-pool>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
